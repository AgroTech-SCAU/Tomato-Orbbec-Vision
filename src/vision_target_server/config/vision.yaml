vision_server:
  ros__parameters:
    # Orbbec RGB-D inputs
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info

    # Only public vision interface
    service_name: /vision/get_targets

    # Detector
    model_path: /home/ubuntu/orbbec_ros2_ws/best.pt
    device: "0"
    inference_confidence_floor: 0.10
    default_confidence: 0.40
    default_max_frame_age_sec: 0.50

    # RGB-D synchronization
    sync_queue_size: 10
    sync_slop_sec: 0.05

    # Depth validation / 2D -> 3D projection
    depth_uint16_scale_m: 0.001
    min_depth_m: 0.25
    max_depth_m: 6.00
    max_depth_mad_m: 0.10
    min_depth_valid_ratio: 0.20
    min_depth_valid_samples: 5
    sample_radius_px: 7
